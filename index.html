<html lang="ar" dir="rtl" data-theme="light">

<style>

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d1520;--fg:#e8eef6;--muted:#9fb0c4}}
:root[data-theme="dark"]{--bg:#0d1520;--fg:#e8eef6;--muted:#9fb0c4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',Tahoma,sans-serif;background:var(--bg);color:var(--fg);padding-bottom:96px}
header{text-align:center;padding:28px 16px 8px}
header h1{margin:0;font-size:26px}
header p{margin:6px 0 0;color:var(--muted);font-size:14px}
.tabs{display:flex;gap:8px;justify-content:center;padding:14px;flex-wrap:wrap}
.tabs button{font-family:inherit;font-size:14px;font-weight:700;padding:8px 16px;border-radius:20px;border:1px solid var(--gold);background:transparent;color:var(--fg);cursor:pointer}
.tabs button.on{background:var(--gold);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;padding:12px 20px;max-width:1350px;margin:auto}
.card{background:#fff;color:#0B2545;border-radius:14px;padding:14px;cursor:pointer;border:2px solid #e3e8ee;position:relative;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(11,37,69,.12)}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,150,90,.25)}
.num{position:absolute;top:10px;left:10px;background:#0B2545;color:#fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.heart{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;border:1px solid #e3e8ee;background:#fff;font-size:20px;line-height:1;cursor:pointer;color:#B8965A}
.card.sel .heart{background:#B8965A;color:#fff;border-color:#B8965A}
.desc{min-height:50px;padding:0 44px 0 40px;font-size:13.5px;line-height:1.6;margin:0 0 6px;text-align:center}
.card svg{width:100%;height:auto;display:block;border-radius:8px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px}
#selbar{position:fixed;left:0;right:0;bottom:0;background:#0B2545;color:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:5}
#selbar input{font-family:inherit;padding:8px 10px;border-radius:8px;border:0;min-width:150px}
#selbar button,.bar button{font-family:inherit;font-size:14px;font-weight:700;padding:8px 14px;border:0;border-radius:8px;background:#fff;color:#0B2545;cursor:pointer}
#selbar button.pri{background:#B8965A;color:#fff}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#13A89E;color:#fff;padding:8px 18px;border-radius:20px;font-weight:700;display:none;z-index:20}
#modal{position:fixed;inset:0;background:rgba(11,37,69,.94);display:none;z-index:10;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#modal.open{display:flex}
.bar{display:flex;gap:8px;justify-content:center;align-items:center;padding:12px;flex-wrap:wrap}
.bar button:hover{background:#B8965A;color:#fff}
#mtitle{color:#fff;font-weight:700;padding:0 8px}
#stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:grab;touch-action:none}
#holder{width:min(78vh,92vw);background:#fff;border-radius:12px;transform-origin:center;user-select:none;overflow:hidden}
#holder svg{width:100%;height:auto;display:block;pointer-events:none}
#mdesc{color:#dfe6ee;text-align:center;padding:8px 16px 16px;font-size:15px}
</style>
</head>
